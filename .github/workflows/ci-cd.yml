name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Окружение — из poetry.lock, то есть ровно то, что у разработчика,
    # вместе с инструментами проверки той же версии. Кеш привязан к хешу
    # lock-файла: поменялись зависимости — кеш пересобирается.
    - name: Install Poetry
      run: pipx install poetry==2.5.1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'poetry'

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Activate the environment for the following steps
      run: echo "$(poetry env info --path)/bin" >> "$GITHUB_PATH"

    # Проверки падают на любом замечании. Прежде flake8 запускался с
    # --exit-zero, а mypy с «|| echo», и сборка проходила при любых ошибках,
    # кроме синтаксических. Настройки — в .flake8 и pyproject.toml, те же,
    # что у pre-commit: CI и разработчик видят одно и то же.
    - name: Linting with flake8
      run: flake8 src tests scripts

    - name: Format check with black
      run: black --check src tests scripts

    - name: Type check with mypy
      run: mypy

    - name: Run tests
      run: |
        # Порог чуть ниже нынешних 62 %: падение покрытия роняет сборку.
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=html --cov-report=term-missing --cov-fail-under=60

    # Отчёт о покрытии — артефактом сборки (скачивается со страницы прогона).
    # Прежде он отправлялся в Codecov, но аккаунта и токена у проекта нет:
    # шаг падал на соединении и делал красным всё задание.
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          htmlcov/
          coverage.xml
        retention-days: 14

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub (optional)
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      if: ${{ env.DOCKER_USERNAME != '' }}

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: travel-churn-api:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Save Docker image as artifact
      run: |
        docker save travel-churn-api:latest | gzip > docker-image.tar.gz

    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: docker-image.tar.gz
        retention-days: 7

  docker-push:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/travel-churn-api:${{ github.sha }}, ${{ secrets.DOCKER_USERNAME }}/travel-churn-api:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Create Docker Hub release note
      run: |
        echo "🚀 Docker image pushed: ${{ secrets.DOCKER_USERNAME }}/travel-churn-api:${{ github.sha }}"
        echo "Commit: ${{ github.event.head_commit.message }}"
        echo "Author: ${{ github.event.head_commit.author.name }}"
