name: Deploy README and Reports to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'reports/**'
      - 'evidently_reports/**'
      - 'presentation.html'
      - '_config.yml'
      - '.github/workflows/deploy-readme.yml'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Debug mode'
        required: false
        default: 'false'

permissions:
  contents: read
  pages: write
  id-token: write

# Критически важно: отменяем предыдущие деплои и блокируем параллельные запуски
concurrency:
  group: "github-pages-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy matplotlib seaborn scikit-learn xgboost mlflow evidently

    - name: Generate visualizations
      run: |
        python scripts/generate_visualizations.py || echo "Visualizations generation skipped"

    - name: Generate training report
      run: |
        python scripts/generate_training_report.py || echo "Training report generation skipped"

    - name: Generate drift report
      run: |
        python scripts/generate_drift_report.py || echo "Drift report generation skipped"

    - name: Copy evidently reports to reports folder
      run: |
        mkdir -p reports/evidently
        cp -r evidently_reports/* reports/evidently/ || echo "No evidently reports to copy"

    - name: Update index.html with current date
      run: |
        sed -i 's/25.05.2026/$(date +%d.%m.%Y)/g' reports/index.html

    - name: Prepare deployment
      run: |
        # Очищаем и создаём папку для деплоя
        rm -rf gh-pages-deploy
        mkdir -p gh-pages-deploy

        echo "=== Копирование файлов для GitHub Pages ==="

        # === ГЛАВНАЯ СТРАНИЦА: README.md как index.md ===
        if [ -f README.md ]; then
          cp README.md gh-pages-deploy/index.md
          echo "✓ README.md → gh-pages-deploy/index.md"
        else
          echo "✗ ERROR: README.md не найден"
          exit 1
        fi

        # Копируем _config.yml для Jekyll (в корень gh-pages-deploy)
        if [ -f _config.yml ]; then
          cp _config.yml gh-pages-deploy/_config.yml
          echo "✓ _config.yml → gh-pages-deploy/_config.yml"
        else
          echo "⚠ WARNING: _config.yml не найден"
        fi

        # === ПРЕЗЕНТАЦИЯ ===
        if [ -f presentation.html ]; then
          cp presentation.html gh-pages-deploy/presentation.html
          echo "✓ presentation.html → gh-pages-deploy/"
        fi

        # === ОТЧЁТЫ в папку /reports ===
        if [ -d reports ]; then
          cp -r reports gh-pages-deploy/reports
          echo "✓ reports/ → gh-pages-deploy/reports/"
        fi

        # === STATIC файлы ===
        if [ -d static ]; then
          mkdir -p gh-pages-deploy/static
          cp -r static/* gh-pages-deploy/static/ 2>/dev/null || true
          echo "✓ static/ → gh-pages-deploy/static/"
        fi

        # === ОТЛАДКА: полная структура ===
        echo ""
        echo "=========================================="
        echo "=== СТРУКТУРА gh-pages-deploy ==="
        echo "=========================================="
        find gh-pages-deploy -type f | head -20
        echo ""
        echo "=== Файлы в корне ==="
        ls -la gh-pages-deploy/
        echo ""
        echo "=== Первые 5 строк index.md ==="
        head -5 gh-pages-deploy/index.md
        echo ""
        echo "=== Содержимое _config.yml ==="
        cat gh-pages-deploy/_config.yml 2>/dev/null || echo "_config.yml не найден"
        echo ""
        echo "=========================================="
        echo "=== Деплой готов! ==="
        echo "=========================================="

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './gh-pages-deploy'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
