name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'reports/**'
      - 'evidently_reports/**'
      - 'presentation.html'
      - 'README.md'
      - '.github/workflows/deploy-reports.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy matplotlib seaborn scikit-learn xgboost mlflow evidently

    - name: Generate visualizations
      run: |
        python scripts/generate_visualizations.py || echo "Visualizations generation skipped"

    - name: Generate training report
      run: |
        python scripts/generate_training_report.py || echo "Training report generation skipped"

    - name: Generate drift report
      run: |
        python scripts/generate_drift_report.py || echo "Drift report generation skipped"

    - name: Generate system monitoring report
      run: |
        python src/monitoring/system_monitor.py || echo "System monitoring generation skipped"

    - name: Copy evidently reports to reports folder
      run: |
        mkdir -p reports/evidently
        cp -r evidently_reports/* reports/evidently/ || echo "No evidently reports to copy"

    - name: Update index.html with current date
      run: |
        sed -i 's/25.05.2026/$(date +%d.%m.%Y)/g' reports/index.html

    - name: Generate README HTML for root
      run: |
        python scripts/generate_readme_html.py || echo "README HTML generation skipped"

    - name: Prepare deployment structure
      run: |
        # Создаём папку для GitHub Pages
        mkdir -p gh-pages

        # Копируем README.md как index.md (GitHub Pages с Jekyll рендерит его автоматически)
        if [ -f README.md ]; then
          cp README.md gh-pages/index.md
        fi

        # Копируем _config.yml для Jekyll
        if [ -f _config.yml ]; then
          cp _config.yml gh-pages/_config.yml
        fi

        # Копируем презентацию на корень
        if [ -f presentation.html ]; then
          cp presentation.html gh-pages/presentation.html
        fi

        # Копируем отчёты в папку reports
        if [ -d reports ]; then
          cp -r reports gh-pages/reports
        fi

        # Копируем static файлы для презентаций
        if [ -d static ]; then
          mkdir -p gh-pages/static
          cp -r static/* gh-pages/static/ 2>/dev/null || true
        fi

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './gh-pages'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
