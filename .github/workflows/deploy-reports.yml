name: Deploy Reports to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'reports/**'
      - 'evidently_reports/**'
      - '.github/workflows/deploy-reports.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-reports:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy matplotlib seaborn scikit-learn xgboost mlflow evidently

    - name: Generate visualizations
      run: |
        python scripts/generate_visualizations.py || echo "Visualizations generation skipped"

    - name: Generate training report
      run: |
        python scripts/generate_training_report.py || echo "Training report generation skipped"

    - name: Generate drift report
      run: |
        python scripts/generate_drift_report.py || echo "Drift report generation skipped"

    - name: Copy evidently reports to reports folder
      run: |
        mkdir -p reports/evidently
        cp -r evidently_reports/* reports/evidently/ || echo "No evidently reports to copy"

    - name: Update index.html with current date
      run: |
        sed -i 's/25.05.2026/$(date +%d.%m.%Y)/g' reports/index.html

    - name: Copy presentation to reports folder
      run: |
        cp presentation.html reports/

    - name: Copy README to reports folder
      run: |
        cp README.md reports/

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './reports'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
