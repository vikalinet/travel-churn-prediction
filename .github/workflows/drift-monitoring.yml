name: Daily Drift Monitoring

on:
  schedule:
    # Каждый день в 9:00 UTC (12:00 по Москве)
    - cron: '0 9 * * *'
  workflow_dispatch:

# Секреты — на уровне задания: переменная, заданная только в env самого шага,
# в его условии `if` ещё не видна, и шаг Telegram прежде не запускался никогда.
env:
  APP_URL: ${{ secrets.APP_URL }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  drift-check:
    runs-on: ubuntu-latest
    name: Проверка дрейфа данных

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Приложение развёрнуто (задан APP_URL) — пересчёт на сервере: там
    # копятся реальные запросы, и дрейф считается по ним.
    - name: Анализ дрейфа на развёрнутом приложении
      if: env.APP_URL != ''
      run: |
        mkdir -p drift-reports
        echo "🚀 POST $APP_URL/api/v1/drift/analyze"
        curl -sS --fail -X POST "$APP_URL/api/v1/drift/analyze" -o /dev/null
        curl -sS --fail "$APP_URL/api/v1/drift/status" -o drift-reports/drift_summary.json
      shell: bash

    # Приложение не развёрнуто — тот же расчёт здесь, по данным репозитория,
    # с HTML-отчётом. Прежде без APP_URL проверка просто пропускалась.
    - name: Install Poetry
      if: env.APP_URL == ''
      run: pipx install poetry==2.5.1

    - name: Set up Python
      if: env.APP_URL == ''
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'poetry'

    - name: Анализ дрейфа по данным репозитория
      if: env.APP_URL == ''
      run: |
        poetry install --no-interaction
        poetry run python scripts/generate_drift_report.py --output-dir drift-reports
      shell: bash

    - name: Итог анализа
      id: drift-status
      run: |
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json
        d = json.load(open("drift-reports/drift_summary.json", encoding="utf-8"))
        drift = d.get("drift_features", 0)
        print(f"drift_count={drift}")
        print(f"total={d.get('total_features', 0)}")
        print(f"max_psi={d.get('max_psi', 'n/a')}")
        print(f"source={d.get('source_label', 'n/a')}")
        print(f"message={d.get('message', '')}")
        print(f"alert={'true' if drift > 0 else 'false'}")
        PY
        cat "$GITHUB_OUTPUT"
      shell: bash

    - name: Сводка в отчёте о запуске
      run: |
        {
          echo "### Дрейф данных"
          echo "- Признаков с дрейфом: ${{ steps.drift-status.outputs.drift_count }} / ${{ steps.drift-status.outputs.total }}"
          echo "- Максимальный PSI: ${{ steps.drift-status.outputs.max_psi }}"
          echo "- Сравниваются: ${{ steps.drift-status.outputs.source }}"
          echo "- ${{ steps.drift-status.outputs.message }}"
        } >> "$GITHUB_STEP_SUMMARY"
      shell: bash

    - name: Уведомление в Telegram
      if: steps.drift-status.outputs.alert == 'true' && env.TELEGRAM_BOT_TOKEN != ''
      run: |
        DASHBOARD="${APP_URL:-https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}}"
        MESSAGE="⚠️ Data Drift Alert
        Дрейф в ${{ steps.drift-status.outputs.drift_count }} признаках из ${{ steps.drift-status.outputs.total }}, макс. PSI ${{ steps.drift-status.outputs.max_psi }}.
        ${{ steps.drift-status.outputs.message }}
        $DASHBOARD"
        curl -sS --fail -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
          --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
          --data-urlencode "text=$MESSAGE" -o /dev/null
      shell: bash
      continue-on-error: true

    - name: Загрузка отчёта
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: drift-report-${{ github.run_id }}
        path: drift-reports/
        if-no-files-found: warn
        retention-days: 30

    # Дрейф — задание завершается с ошибкой: GitHub пришлёт письмо о
    # неудачном запуске, даже если Telegram не настроен.
    - name: Ошибка при дрейфе
      if: steps.drift-status.outputs.alert == 'true'
      run: |
        echo "::error::Обнаружен дрейф данных — см. сводку и артефакт drift-report"
        exit 1
