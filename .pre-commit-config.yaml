# Проверки перед каждым коммитом. Установка в репозиторий (один раз):
#   poetry run pre-commit install
# Прогон по всем файлам вручную:
#   poetry run pre-commit run --all-files
#
# Версии black и flake8 — те же, что в poetry.lock, а настройки берутся из
# pyproject.toml и .flake8: хук, CI и ручной запуск проверяют одинаково.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      # Защита от случайного коммита крупных файлов — данных, моделей,
      # выгрузок. Прежде предел был поднят до 2 МБ «ради MLflow DB»; все
      # файлы, хранимые в git сознательно, укладываются в 1 МБ (mlflow.db —
      # 0,7 МБ, модели — 0,8 МБ), см. README, «Что хранится в git и почему».
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
      - id: black

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
