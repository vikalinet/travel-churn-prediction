[flake8]
max-line-length = 127
exclude = .git,__pycache__,venv,.venv,dist,build
ignore = E203,W503

[black]
line-length = 127
target-version = py39

[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --cov=src --cov-report=html --cov-report=xml
