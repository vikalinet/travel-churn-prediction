services:
  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_started
    volumes:
      - ./models:/app/models
      # Журнал запросов для дрейфа и свежие отчёты переживают пересоздание
      # контейнера (docker compose up --force-recreate).
      - churn_runtime:/app/runtime
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.13.0
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/app/mlruns
      - ./mlflow.db:/seed/mlflow.db:ro
    command: >
      sh -c "cp /seed/mlflow.db /app/mlflow.db &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////app/mlflow.db
      --default-artifact-root /app/mlruns"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  mlflow_data:
  churn_runtime:
