    <style>

            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

        }
        .container {
            background: white;

            border-left: 4px solid #667eea;
        }

            background: none;

        ul { padding-left: 20px; }
        li { margin: 8px 0; }

        .nav {
